name: Webhook Dashboard CI/CD

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Dashboard
        run: npm run build

  publish-and-deploy:
    name: Build Docker Image & Push to GHCR
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Environment & Tag
        id: vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
            echo "image_tag=prod-${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
            echo "image_tag=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/webhook-dashboard:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/webhook-dashboard:${{ steps.vars.outputs.env_name }}-latest

      - name: Output Deployment Info
        run: |
          echo "=============================================="
          echo "Deployed Image: ghcr.io/${{ github.repository_owner }}/webhook-dashboard:${{ steps.vars.outputs.image_tag }}"
          echo "Target Environment: ${{ steps.vars.outputs.env_name }}"
          echo "Git Commit SHA: ${{ github.sha }}"
          echo "Git Branch: ${{ github.ref_name }}"
          echo "=============================================="
